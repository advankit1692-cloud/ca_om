name: repair-ca-html
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair C&A inline script structure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated HTML script boundaries
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s2 = s.replace("<script>window.onload=()=>window.print()<\\/script>", "<scr${''}ipt>window.onload=()=>window.print()<\\/script>")
          s2 = s2.replace("<script>window.print()<\\/script>", "<scr${''}ipt>window.print()<\\/script>")
          s2 = s2.replace("const {getDatabase,ref,set,onValue}=dbMod;", "const {getDatabase,ref,set,get,onValue}=dbMod;")
          start = s2.find("<!-- C&A SOLUTIONS OM — UNIFIED CLOUD / LEGACY DATA BRIDGE -->")
          if start >= 0:
              end = s2.find("</script>", start)
              if end >= 0:
                  end += len("</script>")
                  block = s2[start:end]
                  s2 = s2[:start] + "</body>\n\n        </html>" + s2[end:]
                  marker = "  <script>\n    if ('serviceWorker' in navigator) {"
                  idx = s2.find(marker)
                  if idx >= 0 and block not in s2[:idx]:
                      s2 = s2[:idx] + "\n\n  " + block + "\n\n" + s2[idx:]
          if s2 != s:
              p.write_text(s2, encoding="utf-8")
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair C&A inline script structure"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-ca-html.yml
          git commit -m "Remove temporary repair workflow"
          git push

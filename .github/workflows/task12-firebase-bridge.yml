name: Task 12 Firebase Bridge Integration

on:
  push:
    branches: [task-12-firebase-auth-database]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject Task 12 bridge without rebuilding index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./firebase-task12.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html does not contain </body>; no change made')
              text = text.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
      - name: Commit Task 12 index integration
        run: |
          git config user.name "CA Solutions OM Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index patch required."
          else
            git commit -m "Integrate Task 12 Firebase authentication bridge"
            git push
          fi
